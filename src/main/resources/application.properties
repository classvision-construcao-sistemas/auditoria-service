spring.application.name=auditoria-service
# Variáveis locais lidas do arquivo .env, se existir (não versionado).
spring.config.import=optional:file:.env[.properties]
# Respeita X-Forwarded-* do proxy (Railway/gateway).
server.forward-headers-strategy=framework
server.port=${PORT:8080}
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?connectionTimeZone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
springdoc.swagger-ui.path=/swagger-ui.html
jwt.secret=${JWT_SECRET}
servicos.turma.url=${TURMA_SERVICE_URL:http://localhost:8081}
servicos.reconhecimento.url=${RECONHECIMENTO_SERVICE_URL:http://localhost:5000}
# Foto de celular passa de 1 MB (limite padrão do Spring).
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# CORS (Flutter Web): origens extras em CORS_ALLOWED_ORIGINS, separadas por vírgula.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
